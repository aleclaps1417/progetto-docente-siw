<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Aggiungi Squadre al Torneo</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	
</head>

<body>
	<!-- ==========================================
	         INIZIO NAVBAR (Il blocco magico di prima)
	         ========================================== -->
	<div class="navbar">

		<!-- Zona Sinistra: Titolo o Logo (Opzionale) -->
		<div>
			<strong style="font-size: 1.2rem;">🏆 Gestione Tornei</strong>
		</div>
		<!-- Zona Destra: Link e Login -->
		<div>
			<!-- Se l'utente NON è loggato -->
			<span th:if="${userDetails == null}">
				<a th:href="@{/login}">Login</a> |
				<a th:href="@{/register}">Registrati</a>
			</span>

			<!-- Se l'utente È loggato -->
			<span th:if="${userDetails != null}">
				<span>Benvenuto, <strong th:text="${userDetails.username}"></strong>!</span>

				<!-- Mostra questo link SOLO se ha il ruolo ADMIN -->
				<span th:if="${#lists.contains(userDetails.authorities.![authority], 'ADMIN')}">
					| <a th:href="@{/admin/dashboard}">Area Amministratore</a>
				</span>

				| <form th:action="@{/logout}" method="post" style="display: inline;">
					<button type="submit" class="logout-btn">Logout</button>
				</form>
			</span>

		</div>


	</div>
	<!-- ==========================================
	         FINE NAVBAR
	         ========================================== -->

	<div class="container">
		<h1>Aggiungi Squadre al Torneo: <span th:text="${torneo.nome}">Nome</span></h1>

		<p>Seleziona le squadre da iscrivere a questo torneo:</p>

		<ul th:if="${squadreDisponibili != null and !squadreDisponibili.isEmpty()}">
			<li th:each="squadra : ${squadreDisponibili}" style="margin-bottom: 15px;">
				<strong th:text="${squadra.nome}" style="font-size: 1.2em;">Nome Squadra</strong>
				- <span th:text="${squadra.citta}">Città</span>

				<form th:action="@{/admin/torneo/{t_id}/squadra/{s_id}/add(t_id=${torneo.id}, s_id=${squadra.id})}"
				      method="post"
				      style="display: inline;">
				    <button type="submit" class="btn btn-success">+ Iscrivi al Torneo</button>
				</form>
			</li>
		</ul>

		<p th:if="${squadreDisponibili == null or squadreDisponibili.isEmpty()}">
			<em>Non ci sono altre squadre disponibili da iscrivere.</em>
		</p>

		<br />
		<a th:href="@{/admin/torneo/edit/{id}(id=${torneo.id})}" class="btn btn-secondary">&larr; Torna alla Modifica del Torneo</a>
	</div>
</body>

</html>
