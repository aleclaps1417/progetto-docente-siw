<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Gestione Giocatori</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<!-- ==========================================
	         INIZIO NAVBAR (Il blocco magico di prima)
	         ========================================== -->
	<div class="navbar">

		<!-- Zona Sinistra: Titolo o Logo (Opzionale) -->
		<div>
			<strong style="font-size: 1.2rem;">🏆 Gestione Tornei</strong>
		</div>
		<!-- Zona Destra: Link e Login -->
		<div>
			<!-- Se l'utente NON è loggato -->
			<span th:if="${userDetails == null}">
				<a th:href="@{/login}">Login</a> |
				<a th:href="@{/register}">Registrati</a>
			</span>

			<!-- Se l'utente È loggato -->
			<span th:if="${userDetails != null}">
				<span>Benvenuto, <strong th:text="${userDetails.username}"></strong>!</span>

				<!-- Mostra questo link SOLO se ha il ruolo ADMIN -->
				<span th:if="${#lists.contains(userDetails.authorities.![authority], 'ADMIN')}">
					| <a th:href="@{/admin/dashboard}">Area Amministratore</a>
				</span>

				| <form th:action="@{/logout}" method="post" style="display: inline;">
					<button type="submit" class="logout-btn">Logout</button>
				</form>
			</span>

		</div>


	</div>
	<!-- ==========================================
	         FINE NAVBAR
	         ========================================== -->

	<div class="container">
		<h1>Gestione Giocatori</h1>

		<div style="margin-bottom: 20px;">
			<a th:href="@{/admin/giocatore/new}" class="btn btn-success">+ Aggiungi un nuovo
				Giocatore</a>
		</div>

		<hr>

		<ul th:if="${!giocatori.isEmpty()}">
			<li th:each="giocatore : ${giocatori}" style="margin-bottom: 15px;">

				<strong th:text="${giocatore.nome + ' ' + giocatore.cognome}" style="font-size: 1.2em;">Nome
					Cognome</strong>

				- Ruolo: <span th:text="${giocatore.ruolo}">Ruolo</span>
				- Squadra: <span th:text="${giocatore.squadra != null ? giocatore.squadra.nome : 'Svincolato'}"
					style="font-style: italic; font-weight: bold;">Squadra</span>

				<div style="display: inline-block; margin-left: 15px;">
					<a th:href="@{/admin/giocatore/edit/{id}(id=${giocatore.id})}"
						class="btn-sm btn-warning">✏️ Modifica Dati</a>
				</div>

			</li>
		</ul>

		<p th:if="${giocatori.isEmpty()}">Nessun giocatore presente nel sistema.</p>

		<br>
		<a th:href="@{/admin/dashboard}" class="btn btn-secondary">&larr; Torna alla Dashboard</a>
	</div>
</body>

</html>
