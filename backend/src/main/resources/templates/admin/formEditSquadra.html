<!Doctype html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>Modifica Squadra</title>
		<link rel="stylesheet" th:href="@{/css/style.css}">
	</head>
	<body>
		<div class="container">
			<h1> ✏️ Modifica Squadra</h1>
			
			<form th:action="@{/admin/squadra/edit/{id}(id=${squadra.id})}" method="POST" th:object="${squadra}" class="form-admin">
			<input type="hidden" th:field="*{id}" />
			
			<div class="form-group">
				<label>Nome Squadra:</label>
				<input type="text" th:field="*{nome}"required  class="form-control"/>
				<span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-danger"></span>
			</div>
			<br/>
			
			<div class="form-group">
				<label>Città:</label>
				<input type="text" th:field="*{citta}"required class="form-control"/>
				<span th:if="${#fields.hasErrors('citta')}" th:errors="*{citta}" class="text-danger"></span>	
			</div>
			
			<br/>
			<div class="form-group">
				<label>Anno di Fondazione:</label>
				<input type="number" th:field="*{annoFondazione}" class="form-control" />
				<span th:if="${#fields.hasErrors('annoFondazione')}" th:errors="*{annoFondazione}" class="text-danger"></span>
			</div>
			<br/>
			
			<div class="form-actions">
				<button type="submit" class="btn-primary">💾 Aggiorna Squadra</button>
				<a th:href="@{/admin/squadre}" class="btn btn-secondary">&larr; Annulla e torna alla Gestione Squadre</a>
			</div>
			
			
		</form>
		
		<br/>
		
		
		
		</di>
	</body>
</html>
