<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifica Giocatore</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h1>✏️ Modifica Giocatore</h1>
        
        <form th:action="@{/admin/giocatore/edit/{id}(id=${giocatore.id})}" method="POST" th:object="${giocatore}" class="form-admin">
            
            <input type="hidden" th:field="*{id}" />
            
            <div class="form-group">
                <label>Nome:</label>
                <input type="text" th:field="*{nome}" required  class="form-control"/>
                <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-danger"></span>
            </div>
            <br/>

            <div class="form-group">
                <label>Cognome:</label>
                <input type="text" th:field="*{cognome}" required class="form-control"/>
                <span th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}" class="text-danger"></span>
            </div>
            <br/>

            <div class="form-group">
                <label>Data di Nascita:</label>
                <input type="date" th:field="*{dataDiNascita}" class="form-control"/>
            </div>
            <br/>

            <div class="form-group">
                <label>Ruolo:</label>
                <input type="text" th:field="*{ruolo}" class="form-control"/>
            </div>
            <br/>

            <div class="form-group">
                <label>Altezza (cm):</label>
                <input type="number" th:field="*{altezza}" class="form-control"/>
            </div>
            <br/>

            <div class="form-group">
                <label>Squadra di appartenenza:</label>
                <select th:field="*{squadra}" class="form-control">
                    <option value="">-- Nessuna / Svincolato --</option>
                    <option th:each="sq : ${squadre}" 
                            th:value="${sq.id}" 
                            th:text="${sq.nome}"></option>
                </select>
            </div>
            <br/>
			<div class="form-actions">
				<button type="submit" class="btn-primary">💾 Aggiorna Giocatore</button>
				<a th:href="@{/admin/giocatori}" class="btn btn-secondary">&larr; Annulla e torna alla Gestione Giocatori</a>
			</div>
            
        </form>
        
        <br/>
        
    </div>
</body>
</html>
