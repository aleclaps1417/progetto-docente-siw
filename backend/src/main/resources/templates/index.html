<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<!-- Meta tag FONDAMENTALE per il Responsive Design sui cellulari -->
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Home - Gestione Tornei</title>
	<!-- Colleghiamo il nostro nuovo file CSS esterno -->
	<link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>

	<!-- ==========================================
         INIZIO NAVBAR (Il blocco magico di prima)
         ========================================== -->
	<div class="navbar">

		<!-- Zona Sinistra: Titolo o Logo (Opzionale) -->
		<div>
			<strong style="font-size: 1.2rem;">🏆 Gestione Tornei</strong>
		</div>
		<!-- Zona Destra: Link e Login -->
		<div>
			<!-- Se l'utente NON è loggato -->
			<span th:if="${userDetails == null}">
				<a th:href="@{/login}">Login</a> |
				<a th:href="@{/register}">Registrati</a>
			</span>

			<!-- Se l'utente È loggato -->
			<span th:if="${userDetails != null}">
				<span>Benvenuto, <strong th:text="${userDetails.username}"></strong>!</span>

				<!-- Mostra questo link SOLO se ha il ruolo ADMIN -->
				<span th:if="${#lists.contains(userDetails.authorities.![authority], 'ADMIN')}">
					| <a th:href="@{/admin/dashboard}">Area Amministratore</a>
				</span>

				| <form th:action="@{/logout}" method="post" style="display: inline;">
					<button type="submit" class="logout-btn">Logout</button>
				</form>
			</span>

		</div>


	</div>
	<!-- ==========================================
         FINE NAVBAR
         ========================================== -->

	<!-- CONTENITORE PRINCIPALE CENTRATO -->
	<div class="container">
		<h1>Benvenuto nel Portale dei Tornei! 🏆</h1>

		<p>Scopri le squadre partecipanti e i risultati delle partite.</p>

		<ul>
			<li><a th:href="@{/tornei}">Visualizza tutti i Tornei</a></li>
			<!-- Aggiungi qui altri link pubblici che avevi creato -->
		</ul>
	</div>

</body>

</html>
