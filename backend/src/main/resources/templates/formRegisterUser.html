<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrazione - Gestione Tornei</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<div class="container">
		
	
    <h1>Registrazione Nuovo Utente</h1>

    <form th:action="@{/register}" method="POST" class="form-admin">
        
        <h3>Dati Personali</h3>
        <div>
            <label>Nome:</label>
            <input type="text" th:field="${user.name}" required class="form-control" />
			<span th:if="${#fields.hasErrors('user.name')}" th:errors="${user.name}" class="text-danger"></span>
        </div>
        <div>
            <label>Cognome:</label>
            <input type="text" th:field="${user.surname}" required class="form-control" />
			<span th:if="${#fields.hasErrors('user.surname')}" th:errors="${user.surname}" class="text-danger"></span>
        </div>
        <div>
            <label>Email:</label>
            <input type="email" th:field="${user.email}"required class="form-control"  />
			<span th:if="${#fields.hasErrors('user.email')}"th:errors="${user.email}" class="text-danger"></span>
        </div>

        <h3>Credenziali di Accesso</h3>
        <div>
            <label>Username:</label>
            <input type="text" th:field="${credentials.username}" required class="form-control" />
			<span th:if="${#fields.hasErrors('credentials.username')}" th:errors="${credentials.username}" class="text-danger"></span>
        </div>
        <div>
            <label>Password:</label>
            <input type="password" th:field="${credentials.password}"  required class="form-control"/>
			<span th:if="${#fields.hasErrors('credentials.password')}" th:errors="${credentials.password}" class="text-danger"></span>
        </div>
		<div>
			<label>Conferma Password:</label>
			<input type="password" th:field="${credentials.confirmPassword}" required class="form-control"/>
			<span th:if="${#fields.hasErrors('credentials.confirmPassword')}" th:errors="${credentials.confirmPassword}" class="text-danger"></span>
		</div>
		<div class="form-actions">
			<button type="submit" class="btn-primary">Registrati</button>
		</div>
        
    </form>

    <p>Hai già un account? <a th:href="@{/login}">Accedi qui</a></p>
    <p><a th:href="@{/}">Torna alla Home</a></p>
	</div>
</body>
</html>
