<!DOCTYPE>
<html>

<head>
	<meta charset="UTF-8">
	<!-- Meta tag FONDAMENTALE per il Responsive Design sui cellulari -->
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Elenco Tornei-Gestione Tornei</title>

	<!-- Colleghiamo il file CSS -->
	<link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
	<!-- ==========================================
		         INIZIO NAVBAR (Il blocco magico di prima)
		         ========================================== -->
	<div class="navbar">
		<div>
			<strong style="font-size: 1.2rem;">🏆 Gestione Tornei</strong>
		</div>
		<div>
			<!-- Se l'utente NON è loggato -->
			<span th:if="${userDetails == null}">
				<a th:href="@{/login}">Login</a> |
				<a th:href="@{/register}">Registrati</a>
			</span>

			<!-- Se l'utente È loggato -->
			<span th:if="${userDetails != null}">
				<span>Benvenuto, <strong th:text="${userDetails.username}"></strong>!</span>

				<!-- Mostra questo link SOLO se ha il ruolo ADMIN -->
				<span th:if="${#lists.contains(userDetails.authorities.![authority], 'ADMIN')}">
					| <a th:href="@{/admin/dashboard}">Area Amministratore</a>
				</span>

				| <form th:action="@{/logout}" method="post" style="display: inline;">
					<button type="submit" class="logout-btn">Logout</button>
				</form>
			</span>
		</div>
	</div>
	<!-- ==========================================
		         FINE NAVBAR
		         ========================================== -->
	<div class="container">
		<h1>🏆 Tornei Disponibili</h1>

		<div th:if="${tornei == null or tornei.isEmpty()}">
			<p style="font-size: 1.1rem; color: #666;">Non ci sono tornei al momento.</p>
		</div>
		<!-- GRIGLIA DEI TORNEI (Usa il nuovo Flexbox container) -->
		<div class="card-container" th:if="${tornei != null and !tornei.isEmpty()}">
			<div th:each="torneo : ${tornei}" class="torneo-card">

				<h2 th:text="${torneo.nome}">Nome Finto Torneo</h2>
				<p><strong>Anno:</strong> <span th:text="${torneo.anno}">2000</span></p>
				<br />
				<!-- Usiamo la nuova classe .btn per il pulsante -->
				<a class="btn" th:href="@{'/torneo/' + ${torneo.id}}">Vedi Dettagli e Squadre &rarr;</a>
			</div>
		</div>
		<!-- Pulsante Indietro-->
		<div style="margin-bottom: 40px;">
			<a class="btn btn-secondary" th:href="@{/}">⬅️ Torna alla Home</a>
		</div>
</body>

</html>
