spring.application.name=progetto-docente

#==================================
# = Datasource (Configurazione Postgres)
#==================================
spring.jpa.database=POSTGRESQL
spring.datasource.driver-class-name=org.postgresql.Driver
# Qui diciamo di collegarsi al database  sulla porta 5432
spring.datasource.url=jdbc:postgresql://localhost:5432/pallone
spring.datasource.username=postgres
# ATTENZIONE: Qui inserisci la tua password di Postgres
spring.datasource.password=postgres

#==================================
# = JPA / Hibernate
#==================================
# Mostra le query SQL nella console 
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=debug
# Crea automaticamente le tabelle partendo dalle classi Java
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

#==================================
# = Web server & Thymeleaf
#==================================
server.port=8080
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8


server.error.include-stacktrace=always
server.error.include-message=always
logging.level.org.springframework.web=DEBUG